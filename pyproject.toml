# Root project environment: one .venv (Python 3.12) for tools, operator, console and channels.
# gym/ keeps its own 3.13 env (gym/setup_nemo_gym.sh) and reader/ keeps its own training env.
# Build it with scripts/setup.sh.
[project]
name = "rentus-system"
version = "0.1.0"
description = "Rentus Operator: console + channel automations; installs with rentus_tools and rentus_operator (editable)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.118.0",
  "uvicorn==0.37.0",
  "httpx==0.28.1",
  "python-dotenv==1.1.1",
  "python-multipart==0.0.20",
  "jsonschema==4.25.1",
  "openai>=1.40",
  "playwright==1.55.0",
  "pytest==8.4.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["console*", "channels*"]

[tool.setuptools.package-data]
console = ["static/*"]
channels = ["adapters/selectors/*/*.json", "mock_sites/**/*"]
