# NeMo Gym config for the Rentus Operator environment.
#   cd gym && .venv-nemo/bin/gym env start "+config_paths=[resources_servers/rentus/configs/rentus.yaml,configs/policy_vllm.yaml]"
rentus_resources_server:
  resources_servers:
    rentus:
      entrypoint: app.py
      domain: agent
      verified: false
      description: Rentus Operator sandbox (leasing, listing, ops, recovery) with scripted renters and vendors
      tools_backend: auto
      surface_replies: true
rentus_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 30
      resources_server:
        type: resources_servers
        name: rentus_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: heldout
        type: validation
        jsonl_fpath: resources_servers/rentus/data/heldout.jsonl
        license: CC BY-SA 4.0
      - name: train
        type: train
        jsonl_fpath: resources_servers/rentus/data/train.jsonl
        license: CC BY-SA 4.0
      - name: example
        type: example
        jsonl_fpath: resources_servers/rentus/data/example.jsonl
