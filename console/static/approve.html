<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>Rentus · Approvals</title>
<style>
  :root { --bg: #0e1116; --panel: #161b22; --line: #2a3340; --text: #e8edf3; --muted: #8b97a6; --ok: #3ccf91; --esc: #ffa94d; --err: #ff6b6b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif; font-size: 17px; }
  header { position: sticky; top: 0; background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; align-items: center; gap: 10px; z-index: 2; }
  header b { font-size: 1.1rem; white-space: nowrap; } .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  .dot.live { background: var(--ok); box-shadow: 0 0 0 4px #3ccf9133; } .st { color: var(--muted); font-size: 0.85rem; margin-left: auto; }
  main { padding: 12px 16px 40px; max-width: 640px; margin: 0 auto; }
  h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 18px 0 8px; }
  .card { background: var(--panel); border: 1px solid #6b4a22; border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .card.done { border-color: var(--line); opacity: 0.7; }
  .who { font-weight: 700; font-size: 1.05rem; } .chip { font-size: 0.75rem; padding: 2px 8px; border-radius: 999px; background: #2a3340; color: #c9d4e0; margin-left: 6px; }
  .quote { margin: 8px 0; padding: 8px 10px; background: #232b36; border-radius: 10px; font-size: 0.95rem; }
  .reason { color: #ffd59a; margin: 6px 0; font-size: 0.95rem; }
  .lbl { font-size: 0.78rem; color: var(--muted); margin-top: 8px; }
  textarea { width: 100%; min-height: 84px; font: inherit; font-size: 1rem; color: var(--text); background: #11161d; border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-top: 4px; }
  textarea[readonly] { border-color: transparent; background: #1a2230; }
  .btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
  button { font: inherit; font-weight: 700; color: var(--text); border-radius: 12px; padding: 14px 6px; border: 1px solid var(--line); background: #24456e; min-height: 52px; }
  button.approve { background: #1d5b37; border-color: #2c9a5d; } button.deny { background: #5c1f2b; border-color: #8f2f42; } button.edit { background: #3a3216; border-color: #6b5a22; }
  button:disabled { opacity: 0.5; }
  .empty { color: var(--muted); text-align: center; padding: 28px 8px; line-height: 1.5; }
  .result { margin-top: 8px; font-size: 0.9rem; color: #b8f0cf; }
  .toast { position: fixed; left: 16px; right: 16px; bottom: 18px; background: #1d5b37; border: 1px solid #2c9a5d; padding: 12px 14px; border-radius: 12px; font-weight: 600; text-align: center; display: none; }
</style>
</head>
<body>
<header><span id="dot" class="dot"></span><b>Rentus · Needs you</b><span id="st" class="st">connecting…</span></header>
<main>
  <div id="open"></div>
  <h2 id="doneH" style="display:none">Decided</h2>
  <div id="done"></div>
</main>
<div id="toast" class="toast"></div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const S = { run: null, editing: {}, busy: {} };

function toast(t) { const el = $("toast"); el.textContent = t; el.style.display = "block"; clearTimeout(S.tt); S.tt = setTimeout(() => (el.style.display = "none"), 3500); }

function card(i) {
  const open = i.status === "open";
  const who = i.who ? `${esc(i.who)}${i.channel ? `<span class="chip">${esc(i.channel)}</span>` : ""}${i.language && i.language !== "en" ? `<span class="chip">${esc(i.language)}</span>` : ""}`
    : i.job ? `${esc(i.job.property || "Job")}` : esc(i.ref || "Decision");
  const draft = i.owner_text || i.draft || "";
  return `<div class="card ${open ? "" : "done"}" data-id="${esc(i.esc_id)}">
    <div class="who">${who}</div>
    ${i.last_renter_message ? `<div class="quote">“${esc(i.last_renter_message)}”</div>` : ""}
    ${i.job ? `<div class="quote">${esc(i.job.issue || "")}</div>` : ""}
    <div class="reason">${esc(/^[a-z]+(_[a-z]+)+$/.test(i.reason || "") ? i.reason.replace(/_/g, " ").replace(/^./, (c) => c.toUpperCase()) : i.reason)}</div>
    ${draft ? `<div class="lbl">${open ? "Reply the operator drafted" : "Reply"}</div><textarea ${S.editing[i.esc_id] ? "" : "readonly"}>${esc(draft)}</textarea>` : ""}
    ${open ? `<div class="btns"><button class="approve" data-d="approve">${S.editing[i.esc_id] ? "Send edit" : "Approve"}</button>
      <button class="edit" data-d="edit" ${draft ? "" : "disabled"}>${S.editing[i.esc_id] ? "Cancel" : "Edit"}</button>
      <button class="deny" data-d="deny">Deny</button></div>`
      : `<div class="result">${i.status === "approved" ? "Approved" : "Denied"}${i.decided_via ? " from the " + esc(i.decided_via) : ""}. The operator has it.</div>`}
  </div>`;
}

async function load() {
  try {
    const r = await fetch("/api/approvals").then((x) => x.json());
    S.run = r.run_id;
    $("dot").className = "dot" + (r.run_id ? " live" : "");
    $("st").textContent = r.run_id ? (r.status === "running" ? "operator working" : r.status || "") : "no run";
    if (Object.values(S.editing).some(Boolean)) return;  // keep the text the owner is typing
    const open = r.items.filter((i) => i.status === "open"), done = r.items.filter((i) => i.status !== "open");
    $("open").innerHTML = open.length ? open.map(card).join("") : `<div class="empty">Nothing needs you right now.<br>The operator is handling everything else.</div>`;
    $("done").innerHTML = done.map(card).join("");
    $("doneH").style.display = done.length ? "" : "none";
    document.title = open.length ? `(${open.length}) Rentus · Approvals` : "Rentus · Approvals";
  } catch (e) { $("st").textContent = "offline"; $("dot").className = "dot"; }
}

$("open").onclick = async (e) => {
  const b = e.target.closest("button[data-d]");
  if (!b) return;
  const c = b.closest(".card"), id = c.dataset.id;
  if (b.dataset.d === "edit") { S.editing[id] = !S.editing[id]; const ta = c.querySelector("textarea");
    if (S.editing[id]) { ta.removeAttribute("readonly"); ta.focus(); b.textContent = "Cancel"; c.querySelector(".approve").textContent = "Send edit"; }
    else { load(); } return; }
  c.querySelectorAll("button").forEach((x) => (x.disabled = true));
  const text = S.editing[id] ? c.querySelector("textarea").value : null;
  try {
    const r = await fetch(`/api/runs/${S.run}/escalations/${id}`, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ decision: b.dataset.d === "deny" ? "deny" : "approve", text, source: "phone" }) });
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    toast(b.dataset.d === "deny" ? "Denied. The operator won't do it." : text ? "Sent your edit to the operator." : "Approved. The operator is sending it.");
    if (navigator.vibrate) navigator.vibrate(30);
  } catch (err) { toast("Didn't go through: " + err.message); }
  S.editing[id] = false;
  load();
};

load();
setInterval(load, 2000);
</script>
</body>
</html>
