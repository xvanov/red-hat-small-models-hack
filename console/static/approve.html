<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rentus Approvals</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root { --bg: #f7f7f8; --surface: #fff; --surface-2: #f3f4f6; --line: #e6e7eb; --line-2: #d9dbe1; --text: #16181d; --text-2: #3d424d; --muted: #6b7180;
    --accent: #4f5bd5; --accent-soft: #eef0fd; --ok: #18794e; --err: #c4302b; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1012; --surface: #16171a; --surface-2: #1c1d21; --line: #26282d; --line-2: #33363c; --text: #ececef;
    --text-2: #c4c6cc; --muted: #8b8f98; --accent: #7c86f0; --accent-soft: #1f2240; --ok: #3fae7a; --err: #f2726c; color-scheme: dark; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  header { position: sticky; top: 0; z-index: 2; background: var(--surface); border-bottom: 1px solid var(--line); padding: 14px 16px; display: flex; align-items: center; gap: 10px; }
  header svg { width: 22px; height: 22px; }
  header b { font-weight: 600; }
  header .st { margin-left: auto; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--ok); }
  main { max-width: 600px; margin: 0 auto; padding: 8px 16px 48px; }
  h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 18px 0 10px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .who { font-weight: 600; font-size: 17px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .chip { font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--line); color: var(--text-2); }
  .quote { margin: 10px 0 0; padding: 9px 12px; background: var(--surface-2); border-radius: 12px 12px 12px 4px; font-size: 15px; }
  .reason { margin-top: 10px; color: var(--muted); font-size: 14px; }
  .lbl { font-size: 12px; color: var(--muted); margin-top: 12px; font-weight: 500; }
  .draft { margin-top: 6px; padding: 10px 12px; background: var(--accent-soft); border-radius: 10px; white-space: pre-wrap; font-size: 15px; }
  textarea { width: 100%; min-height: 96px; margin-top: 6px; font: inherit; font-size: 16px; color: var(--text); background: var(--surface); border: 1.5px solid var(--accent);
    border-radius: 10px; padding: 10px 12px; resize: vertical; outline: none; }
  .btns { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 8px; margin-top: 12px; }
  button { font: inherit; font-weight: 600; min-height: 48px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); color: var(--text); }
  button.approve { background: var(--ok); border-color: var(--ok); color: #fff; }
  button.deny { color: var(--err); }
  button:disabled { opacity: .5; }
  .empty { text-align: center; color: var(--muted); padding: 64px 16px; }
  .empty b { display: block; color: var(--text); font-size: 17px; margin-bottom: 4px; }
  .err { margin-top: 10px; padding: 8px 10px; border-radius: 8px; background: color-mix(in srgb, var(--err) 12%, transparent); color: var(--err); font-size: 14px; }
  .done { color: var(--muted); font-size: 14px; padding: 10px 2px; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<header>
  <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="2" width="20" height="20" rx="6" fill="var(--accent)"/><path d="M7 17V8.5L12 6l5 2.5V17h-3.5v-4h-3v4H7z" fill="#fff"/></svg>
  <b>Approvals</b>
  <span class="st" id="st"><span class="dot"></span>connecting</span>
</header>
<main>
  <h2 id="head">Needs you</h2>
  <div id="list"></div>
  <div id="recent"></div>
</main>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const NAMES = { messenger_personal: "Marketplace · Messenger", messenger: "Messenger", sms: "SMS", email: "Email" };
const S = { items: [], editing: {}, key: "", recent: [], sending: {}, err: {} };
const isNote = (a) => ["report", "error"].includes(a.kind);
function humanize(t) {
  return String(t ?? "")
    .replace(/\bthread(?:_id)?\s*(?:[=:]\s*|(?=['"]))['"]?[\w:.@+-]+['"]?/gi, "thread")
    .replace(/\b(?:approval_id|message_id|ref_id|esc_id|call_id|listing_id|room_id)\s*(?:[=:]\s*|(?=['"]))['"]?[\w:.@+-]+['"]?/gi, "")
    .replace(/\b(?:messenger_personal|messenger|sms|email|craigslist|roomies|padsplit|marketplace):[0-9a-f]{6,}\b/gi, "")
    .replace(/\b[0-9a-f]{12,}\b/gi, "").replace(/\s+([,.;:)])/g, "$1").replace(/,(\s*,)+/g, ",").replace(/\(\s*\)/g, "")
    .replace(/\s{2,}/g, " ").trim().replace(/^./, (c) => c.toUpperCase());
}

async function load() {
  try {
    const r = await fetch("/api/live/approvals", { cache: "no-store" }).then((x) => x.json());
    S.items = r.items || [];
    $("#st").innerHTML = `<span class="dot on"></span>live`;
  } catch {
    $("#st").innerHTML = `<span class="dot"></span>offline`;
  }
  render();
}
function render() {
  if (document.activeElement && document.activeElement.tagName === "TEXTAREA") return; // don't clobber typing
  const key = JSON.stringify([S.items, S.editing, S.recent, S.sending, S.err]);
  if (key === S.key) return;
  S.key = key;
  const acts = S.items.filter((a) => !isNote(a)), notes = S.items.filter(isNote);
  $("#head").textContent = acts.length ? `Needs you · ${acts.length}` : "Needs you";
  $("#list").innerHTML = (acts.length ? acts.map((a) => {
    const ed = a.id in S.editing, hasDraft = !!(a.draft_text || "").trim();
    return `<div class="card" data-id="${esc(a.id)}">
      <div class="who">${esc(a.who || "Renter")}${a.channel ? `<span class="chip">${esc(NAMES[a.channel] || a.channel[0].toUpperCase() + a.channel.slice(1))}</span>` : ""}${a.source === "assistant" ? `<span class="chip">Assistant</span>` : ""}</div>
      ${a.last_message ? `<div class="quote">${esc(a.last_message)}</div>` : ""}
      ${a.reason ? `<div class="reason">${esc(humanize(a.reason))}</div>` : ""}
      ${ed ? `<div class="lbl">Your reply</div><textarea>${esc(S.editing[a.id])}</textarea>`
           : a.draft_text ? `<div class="lbl">Drafted reply</div><div class="draft">${esc(a.draft_text)}</div>` : ""}
      ${S.err[a.id] ? `<div class="err">${esc(S.err[a.id])}</div>` : ""}
      <div class="btns">${S.sending[a.id] ? `<button class="approve" disabled>Sending…</button><span></span><span></span>` : ed
        ? `<button class="approve" data-act="send-edit">Send</button><button data-act="cancel">Cancel</button><span></span>`
        : hasDraft ? `<button class="approve" data-act="approve">Approve</button><button data-act="edit">Edit</button><button class="deny" data-act="deny">Deny</button>`
        : `<button data-act="dismiss">Dismiss</button><span></span><span></span>`}</div>
    </div>`;
  }).join("") : `<div class="empty"><b>You're all caught up</b>Nothing is waiting for your decision.</div>`)
  + (notes.length ? `<h2>Notes from the operator</h2>` + notes.map((a) => `<div class="card note" data-id="${esc(a.id)}"><div class="reason" style="margin:0">${esc(humanize(a.reason || ""))}</div><div class="btns" style="grid-template-columns:1fr"><button data-act="dismiss">Dismiss</button></div></div>`).join("") : "");
  $("#recent").innerHTML = S.recent.length ? `<h2>Just decided</h2>` + S.recent.map((r) => `<div class="done">${esc(r)}</div>`).join("") : "";
}
document.addEventListener("input", (e) => {
  const c = e.target.closest(".card");
  if (c && e.target.tagName === "TEXTAREA") S.editing[c.dataset.id] = e.target.value;
});
document.addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-act]");
  if (!b) return;
  const card = b.closest(".card"), id = card.dataset.id, act = b.dataset.act;
  const a = S.items.find((x) => x.id === id) || {};
  if (act === "edit") { S.editing[id] = a.draft_text || ""; S.key = ""; render(); card.querySelector("textarea")?.focus(); return; }
  if (act === "cancel") { delete S.editing[id]; document.activeElement.blur(); S.key = ""; render(); return; }
  const body = act === "send-edit" ? { decision: "edit", text: S.editing[id] || "", source: "phone" } : { decision: act, source: "phone" };
  if (act === "send-edit" && !(S.editing[id] || "").trim()) return;
  card.querySelectorAll("button").forEach((x) => (x.disabled = true));
  delete S.err[id];
  if (act === "approve" || act === "send-edit") { S.sending[id] = true; S.key = ""; render(); }
  let r, d = {};
  try {
    r = await fetch("/api/live/approvals/" + encodeURIComponent(id), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    d = await r.json().catch(() => ({}));
  } catch {
    delete S.sending[id];
    S.err[id] = "Not sent: network error";
    S.key = "";
    render();
    return;
  }
  delete S.sending[id];
  const delivered = r.ok && d.ok && (d.sent || ["sent", "recorded"].includes(d.status));
  if (r.ok && !delivered && (act === "approve" || act === "send-edit")) {
    S.err[id] = "Not sent: " + (d.error || d.status || "the channel did not confirm delivery");
  } else if (r.ok) {
    delete S.editing[id];
    S.items = S.items.filter((x) => x.id !== id);
    S.recent.unshift(act === "dismiss" ? "Dismissed a note" : `${act === "deny" ? "Denied" : act === "send-edit" ? "Sent your edited reply to" : "Sent the reply to"} ${a.who || "renter"}`);
    S.recent = S.recent.slice(0, 5);
  } else {
    S.err[id] = "Not sent: " + (d.detail || d.error || r.status);
  }
  if (document.activeElement) document.activeElement.blur();
  S.key = "";
  load();
});
(async function loop() { try { await load(); } catch { /* keep polling */ } setTimeout(loop, 2500); })();
</script>
</body>
</html>
