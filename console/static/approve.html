<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Rentus · Approvals</title>
<style>
  :root { --bg: #f4f5f8; --surface: #fff; --surface-2: #f7f8fa; --line: #e3e6ec; --text: #121826; --text-2: #3b4456; --muted: #6b7486;
    --accent: #4f46e5; --accent-2: #eef0ff; --accent-ink: #fff; --ok: #12805c; --ok-bg: #e7f6ef; --err: #c0262d; --err-bg: #fdeced; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b0e14; --surface: #131722; --surface-2: #181d2a; --line: #252b3a; --text: #e8ebf2; --text-2: #c2c8d4;
    --muted: #8b93a7; --accent: #8187ff; --accent-2: #20244a; --accent-ink: #0b0e14; --ok: #4fd1a0; --ok-bg: #12291f; --err: #ff7a80; --err-bg: #331a1d; color-scheme: dark; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif; font-size: 17px; -webkit-font-smoothing: antialiased; }
  header { position: sticky; top: 0; background: var(--surface); border-bottom: 1px solid var(--line); padding: 14px 16px; display: flex; align-items: center; gap: 10px; z-index: 2; }
  header svg { width: 28px; height: 28px; flex: none; }
  header b { font-size: 1.05rem; white-space: nowrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.live { background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 22%, transparent); }
  .st { color: var(--muted); font-size: 0.82rem; margin-left: auto; display: flex; align-items: center; gap: 6px; }
  main { padding: 14px 16px 48px; max-width: 640px; margin: 0 auto; }
  h2 { font-size: 0.76rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin: 22px 0 10px; font-weight: 600; }
  .card { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 14px; padding: 16px; margin-bottom: 14px;
    box-shadow: 0 1px 3px rgba(16, 24, 40, 0.06); }
  .card.done { border-left-color: var(--line); opacity: 0.75; box-shadow: none; }
  .who { font-weight: 700; font-size: 1.1rem; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 0.74rem; font-weight: 500; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--text-2); }
  .quote { margin: 10px 0; padding: 10px 12px; background: var(--surface-2); border-radius: 12px 12px 12px 4px; font-size: 0.95rem; line-height: 1.45; }
  .reason { margin: 8px 0; font-size: 0.95rem; line-height: 1.45; color: var(--text-2); }
  .lbl { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-top: 12px; font-weight: 600; }
  textarea { width: 100%; min-height: 88px; font: inherit; font-size: 1rem; line-height: 1.45; color: var(--text); background: var(--surface); border: 2px solid var(--accent);
    border-radius: 12px; padding: 10px 12px; margin-top: 6px; resize: vertical; }
  textarea[readonly] { border-color: transparent; background: var(--accent-2); }
  .btns { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 8px; margin-top: 12px; }
  button { font: inherit; font-weight: 700; color: var(--text); border-radius: 12px; padding: 14px 6px; border: 1px solid var(--line); background: var(--surface); min-height: 54px; }
  button.approve { background: var(--ok); border-color: var(--ok); color: var(--surface); }
  button.deny { color: var(--err); }
  button:disabled { opacity: 0.5; }
  .empty { color: var(--muted); text-align: center; padding: 48px 12px; line-height: 1.6; }
  .empty b { display: block; color: var(--text); font-size: 1.1rem; margin-bottom: 4px; }
  .result { margin-top: 10px; font-size: 0.9rem; color: var(--ok); font-weight: 600; }
  .toast { position: fixed; left: 16px; right: 16px; bottom: 20px; background: var(--text); color: var(--bg); padding: 14px 16px; border-radius: 14px; font-weight: 600;
    text-align: center; display: none; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25); }
</style>
</head>
<body>
<header><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="var(--accent)"/><path d="M8 15.5 16 9l8 6.5V24a1 1 0 0 1-1 1h-4.5v-5.5h-5V25H9a1 1 0 0 1-1-1z" fill="none" stroke="var(--accent-ink)" stroke-width="2.2" stroke-linejoin="round"/></svg><b>Needs you</b><span class="st"><span id="dot" class="dot"></span><span id="st">connecting…</span></span></header>
<main>
  <div id="open"></div>
  <h2 id="doneH" style="display:none">Decided</h2>
  <div id="done"></div>
</main>
<div id="toast" class="toast"></div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const S = { run: null, editing: {}, busy: {} };

function toast(t) { const el = $("toast"); el.textContent = t; el.style.display = "block"; clearTimeout(S.tt); S.tt = setTimeout(() => (el.style.display = "none"), 3500); }

function card(i) {
  const open = i.status === "open";
  const who = i.who ? `${esc(i.who)}${i.channel ? `<span class="chip">${esc(i.channel)}</span>` : ""}${i.language && i.language !== "en" ? `<span class="chip">${esc(i.language)}</span>` : ""}`
    : i.job ? `${esc(i.job.property || "Job")}` : esc(i.ref || "Decision");
  const draft = i.owner_text || i.draft || "";
  return `<div class="card ${open ? "" : "done"}" data-id="${esc(i.esc_id)}">
    <div class="who">${who}</div>
    ${i.last_renter_message ? `<div class="quote">“${esc(i.last_renter_message)}”</div>` : ""}
    ${i.job ? `<div class="quote">${esc(i.job.issue || "")}</div>` : ""}
    <div class="reason">${esc(/^[a-z]+(_[a-z]+)+$/.test(i.reason || "") ? i.reason.replace(/_/g, " ").replace(/^./, (c) => c.toUpperCase()) : i.reason)}</div>
    ${draft ? `<div class="lbl">${open ? "Reply the operator drafted" : "Reply sent"}</div><textarea ${S.editing[i.esc_id] ? "" : "readonly"}>${esc(draft)}</textarea>` : ""}
    ${open ? `<div class="btns"><button class="approve" data-d="approve">${S.editing[i.esc_id] ? "Send edit" : "Approve"}</button>
      <button class="edit" data-d="edit" ${draft ? "" : "disabled"}>${S.editing[i.esc_id] ? "Cancel" : "Edit"}</button>
      <button class="deny" data-d="deny">Deny</button></div>`
      : `<div class="result">${i.status === "approved" ? "Approved" : "Denied"}${i.decided_via ? " from the " + esc(i.decided_via) : ""}. The operator has it.</div>`}
  </div>`;
}

async function load() {
  try {
    const r = await fetch("/api/approvals").then((x) => x.json());
    S.run = r.run_id;
    $("dot").className = "dot" + (r.run_id ? " live" : "");
    $("st").textContent = r.run_id ? (r.status === "running" ? "operator working" : r.status || "") : "no run";
    if (Object.values(S.editing).some(Boolean)) return;  // keep the text the owner is typing
    const open = r.items.filter((i) => i.status === "open"), done = r.items.filter((i) => i.status !== "open");
    $("open").innerHTML = open.length ? open.map(card).join("") : `<div class="empty"><b>Nothing needs you right now.</b>The operator is handling everything else.</div>`;
    $("done").innerHTML = done.map(card).join("");
    $("doneH").style.display = done.length ? "" : "none";
    document.title = open.length ? `(${open.length}) Rentus · Approvals` : "Rentus · Approvals";
  } catch (e) { $("st").textContent = "offline"; $("dot").className = "dot"; }
}

$("open").onclick = async (e) => {
  const b = e.target.closest("button[data-d]");
  if (!b) return;
  const c = b.closest(".card"), id = c.dataset.id;
  if (b.dataset.d === "edit") { S.editing[id] = !S.editing[id]; const ta = c.querySelector("textarea");
    if (S.editing[id]) { ta.removeAttribute("readonly"); ta.focus(); b.textContent = "Cancel"; c.querySelector(".approve").textContent = "Send edit"; }
    else { load(); } return; }
  c.querySelectorAll("button").forEach((x) => (x.disabled = true));
  const text = S.editing[id] ? c.querySelector("textarea").value : null;
  try {
    const r = await fetch(`/api/runs/${S.run}/escalations/${id}`, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ decision: b.dataset.d === "deny" ? "deny" : "approve", text, source: "phone" }) });
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    toast(b.dataset.d === "deny" ? "Denied. The operator won't do it." : text ? "Sent your edit to the operator." : "Approved. The operator is sending it.");
    if (navigator.vibrate) navigator.vibrate(30);
  } catch (err) { toast("Didn't go through: " + err.message); }
  S.editing[id] = false;
  load();
};

load();
setInterval(load, 2000);
</script>
</body>
</html>
