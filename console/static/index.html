<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rentus Operator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/app.css?v=4">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="2" width="20" height="20" rx="6" fill="var(--accent)"/><path d="M7 17V8.5L12 6l5 2.5V17h-3.5v-4h-3v4H7z" fill="var(--accent-ink)"/></svg>
      Rentus Operator
    </div>
    <div class="status">
      <span class="stat" id="st-op" title="Operator model"><span class="dot"></span>Operator · Lightning on vLLM</span>
      <span class="stat" id="st-reader" title="Reader model"><span class="dot"></span>Reader 0.6B</span>
      <span class="sep"></span>
      <span id="st-channels" class="stat ch"><span class="dot"></span>Channels</span>
    </div>
  </header>

  <nav class="nav">
    <a href="#/inbox" data-tab="inbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>Inbox<span class="count" id="nav-inbox" hidden></span></a>
    <a href="#/assistant" data-tab="assistant"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Assistant<span class="count" id="nav-assistant" hidden></span></a>
    <a href="#/pipeline" data-tab="pipeline"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/></svg>Pipeline</a>
    <a href="#/model" data-tab="model"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15v2M11 10v7M15 12v5M19 6v11"/></svg>Model</a>
    <a href="#/data" data-tab="data"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>Data</a>
    <div class="foot">Approve from your phone at <a href="/approve" id="approve-link">/approve</a></div>
  </nav>

  <main>
    <section class="page fixed" id="page-inbox" hidden></section>
    <section class="page fixed" id="page-assistant" hidden></section>
    <section class="page" id="page-pipeline" hidden></section>
    <section class="page" id="page-model" hidden></section>
    <section class="page" id="page-data" hidden></section>
  </main>
</div>
<script src="/static/app.js?v=4"></script>
</body>
</html>
