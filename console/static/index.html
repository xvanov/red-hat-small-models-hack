<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rentus Operator</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="brand">Rentus Operator</div>
  <span id="badge" class="badge stub" title="">checking model…</span>
  <span id="runinfo" class="muted"></span>
  <div class="spacer"></div>
  <label class="ctl">Scenario
    <select id="scenario"><option value="">(free play)</option></select>
  </label>
  <button id="runScenario">Run scenario</button>
  <label class="ctl">Speed
    <select id="speed">
      <option value="0.5">0.5×</option><option value="1" selected>1×</option>
      <option value="2">2×</option><option value="4">4×</option><option value="10">10×</option>
    </select>
  </label>
  <div class="break">
    <button id="breakBtn" class="danger">Break something ▾</button>
    <div id="breakMenu" class="menu hidden">
      <div class="menu-title">Inject a fault into the running world</div>
      <div id="faultList"></div>
      <label class="ctl small">on tool
        <select id="faultTool">
          <option value="">(default for that fault)</option>
          <option>send_message</option><option>read_reply</option><option>publish_listing</option>
          <option>request_quote</option><option>book_vendor</option><option>upsert_renter</option>
          <option>propose_showing</option><option>find_vendors</option>
        </select>
      </label>
    </div>
  </div>
  <button id="newRun" class="ghost">New run</button>
</header>

<main>
  <section id="chat" class="panel">
    <h2>Owner</h2>
    <div id="chatLog" class="chatlog"></div>
    <form id="chatForm">
      <textarea id="chatInput" rows="3" placeholder="Appling Way room free Nov 1, $750, private bath"></textarea>
      <button type="submit">Send</button>
    </form>
    <div class="hints">
      <button class="hint" data-text="Appling Way room free Nov 1, $750, private bath">Appling Way room, $750</button>
      <button class="hint" data-text="Kitchen sink is leaking at Appling Way, find a plumber">Sink leak: find a plumber</button>
    </div>
  </section>

  <section id="lanes" class="panel lanes"></section>

  <section id="side" class="panel side">
    <h2>Demand register</h2>
    <div class="tablewrap"><table id="register">
      <thead><tr><th>Renter</th><th>Lease</th><th>Move-in</th><th>Phone</th><th>Reason</th><th>Occ.</th><th>Status</th></tr></thead>
      <tbody></tbody>
    </table></div>
    <h2>Needs you <span id="escCount" class="count"></span></h2>
    <div id="escalations"></div>
    <h2>Ops</h2>
    <div id="spend"></div>
    <div id="jobs"></div>
  </section>
</main>

<footer>
  <section class="panel trace">
    <h2>Live trace
      <span class="legend">
        <i class="lg tool"></i>tool call <i class="lg ok"></i>ok <i class="lg err"></i>error
        <i class="lg ver"></i>verifier <i class="lg retry"></i>retry <i class="lg fb"></i>fallback
        <i class="lg esc"></i>escalation <i class="lg fault"></i>fault
      </span>
      <label class="ctl small"><input type="checkbox" id="followTrace" checked> follow</label>
    </h2>
    <div id="trace"></div>
  </section>
  <section class="panel score">
    <h2>Scoreboard <span class="muted small">results/*/summary.json</span></h2>
    <div id="scoreboard"></div>
  </section>
</footer>
<script src="/static/app.js"></script>
</body>
</html>
