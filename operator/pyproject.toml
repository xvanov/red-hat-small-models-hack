[project]
name = "rentus-operator"
version = "0.1.0"
description = "Rentus operator: agent loop + deterministic verifier over an OpenAI-compatible endpoint"
requires-python = ">=3.12"
dependencies = ["openai>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rentus-operator = "rentus_operator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rentus_operator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
