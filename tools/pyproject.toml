[project]
name = "rentus_tools"
version = "0.1.0"
description = "Rentus Operator sandbox tools: schemas, world state, fault injection, events (contracts/tools.md)"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.17"]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rentus_tools*"]

[tool.setuptools.package-data]
rentus_tools = ["fixtures/*.json", "data/*.csv", "impl/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
